# DeepSeek-V4-Pro (FP4) on GB200, MegaMOE mid-curve 1P+1D P/D disagg via
# llm-d-vllm. Sibling of dsv4-fp4-gb200-1p1d-simple.yaml; same number of
# nodes, different engine config.
#
# Mirrors topology #3 from dsv4-fp4-gb200-dynamo-vllm
# (search-space conc-list [256, 512, 1024]) and the upstream NVIDIA
# srt-slurm recipe at
# benchmarks/multi_node/srt-slurm-recipes/vllm/deepseek-v4/8k1k/disagg-gb200-mid-curve-megamoe.yaml.
# Goal: apples-to-apples llm-d-vllm vs dynamo-vllm at the same
# concurrency points on the same SKU + model + bench, with both sides
# running DEP=8 on prefill AND decode (the "MegaMOE" mid-curve shape).
#
# Topology (GB200 = 4 GPUs/node):
#   Prefill: 1 worker, 8 GPUs across 2 nodes (LWS_GROUP_SIZE=2),
#            TP=1 DP=8 EP=8 (DP-attention, deep_gemm_mega_moe,
#            EP weight filter).
#   Decode:  1 worker, 8 GPUs across 2 nodes (LWS_GROUP_SIZE=2),
#            TP=1 DP=8 EP=8 (DP-attention, deep_gemm_mega_moe,
#            EP weight filter, FULL_DECODE_ONLY graphs).
#   Total:   4 GB200 nodes / 16 GPUs (no infra/etcd node, llm-d does
#            not need NATS/etcd; the dynamo-vllm sibling spends 5 nodes
#            because its infra node is dedicated).
#
# Selected via additional-settings:
#   CONFIG_FILE=dsv4-fp4-gb200-mid-curve-megamoe.yaml
#   PREFILL_NODES=2 DECODE_NODES=2 GPUS_PER_NODE=4

# ---- EPP scheduling config ----
# Same plugins/profiles as dsv4-fp4-gb200-1p1d-simple.yaml. EPP routing
# is engine-config-agnostic.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig

plugins:
  - name: file-disc
    type: file-discovery
    parameters:
      path: /tmp/endpoints.yaml
      watchFile: false

  - type: disagg-headers-handler
  - type: always-disagg-pd-decider
  - type: disagg-profile-handler
    parameters:
      deciderPluginName: always-disagg-pd-decider
  - type: prefill-filter
  - type: decode-filter
  - type: prefix-cache-scorer
  - type: queue-scorer
  - type: kv-cache-utilization-scorer
  - type: active-request-scorer
  - type: max-score-picker

schedulingProfiles:
  - name: prefill
    plugins:
      - pluginRef: prefill-filter
      - pluginRef: prefix-cache-scorer
        weight: 3
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: max-score-picker
  - name: decode
    plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
      - pluginRef: max-score-picker

dataLayer:
  discovery:
    pluginRef: file-disc

# ---- Per-role vLLM flags ----
# Engine config mirrors the upstream srt-slurm mid-curve-megamoe recipe
# byte-for-byte (less the dynamo-only frontend keys). The MegaMOE shape
# differs from the low-latency 1P+1D in three ways:
#   1. Decode is DEP=8 (TP=1, DP=8, EP) instead of pure TP=8. This is
#      what the "MegaMOE" name refers to: every MoE rank runs experts
#      locally with DP-attention to hide cross-rank latency, instead of
#      sharding tensors.
#   2. moe-backend = deep_gemm_mega_moe on both sides (the higher-perf
#      path; the simple recipe doesn't override moe-backend).
#   3. enable-ep-weight-filter on both sides keeps only the experts a
#      rank actually serves resident on GPU; without it, DEP=8 OOMs
#      because every rank tries to hold all experts.
prefill:
  tp: 1
  enable-expert-parallel: true
  # Tier 1+2 upstream-wide-ep-lws-style tuning (2026-06-16):
  #   - dropped --enable-sleep-mode (carryover from earlier OOM fix; not needed at max-model-len=9280)
  #   - dropped --no-enable-prefix-caching, --no-enable-flashinfer-autotune
  #   - lowered --gpu-memory-utilization 0.95 -> 0.9
  # Re-added --enable-cumem-allocator (2026-06-19): on v0.23+ this puts the
  # KV cache in cumem memory, which is REQUIRED to transfer KV over MNNVL
  # (GB200 cross-node NVLink). Without it, cross-node KV falls off the
  # MNNVL path; combined with UCX_TLS lacking rc that meant TCP transfer
  # (per upstream wide-ep-lws owner) - the likely cause of the prefill
  # KV-handoff backup. (Older releases got cumem via --enable-sleep-mode.)
  #
  # Prefill now matches the dynamo-vllm reference recipe's prefill config in
  # full (3148/5336/6036 tok/s/GPU): see
  # benchmarks/multi_node/srt-slurm-recipes/vllm/deepseek-v4/8k1k/disagg-gb200-mid-curve-megamoe.yaml.
  # Goal: test whether the prefill batch budget closes the throughput gap.
  # At ISL 8192 the default max-num-batched-tokens=8192 batched ONE prefill
  # per step (EPP showed RunningRequestsSize=1, WaitingQueueSize=177, KV
  # 6.7%), serializing admission at ~4 req/s and flattening throughput vs
  # concurrency (~2000 tok/s/GPU). 32768 lets prefill batch ~4 per step.
  # The batch budget could NOT be isolated: 32768 at gpu-mem 0.9 OOM'd on the
  # KV-block check, and at 0.95 (alone) hit a hard CUDA OOM during warmup
  # (32768-token activation peak + NCCL/NIXL/DeepGEMM runtime overran 184 GiB).
  # 32768 only fits with the reference's companion memory-reducers, so they
  # are restored together as a set:
  #   - --max-num-batched-tokens 32768  (the prefill batch lever)
  #   - --gpu-memory-utilization 0.95   (headroom for the larger batch)
  #   - --max-num-seqs 16               (caps per-seq buffers/block tables)
  #   - --no-enable-prefix-caching      (random prompts -> ~0 hit; frees KV)
  #   - --no-enable-flashinfer-autotune (avoids autotune workspace)
  # --enable-cumem-allocator is the v0.23 equivalent of the reference's
  # --enable-sleep-mode (KV in cumem for MNNVL transfer).
  extra-args: >-
    --kv-cache-dtype fp8
    --max-model-len 9280
    --max-num-seqs 16
    --max-num-batched-tokens 32768
    --enforce-eager
    --gpu-memory-utilization 0.95
    --enable-cumem-allocator
    --no-async-scheduling
    --no-enable-prefix-caching
    --no-enable-flashinfer-autotune
    --block-size 256
    --tokenizer-mode deepseek_v4
    --moe-backend deep_gemm_mega_moe
    --enable-ep-weight-filter
    --no-disable-hybrid-kv-cache-manager
    --numa-bind
  env:
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    NCCL_P2P_LEVEL: "NVL"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    # Added rc (IB verbs) so cross-node KV falls back to InfiniBand, not
    # TCP, when MNNVL/cuda_ipc is unavailable. Prior value lacked rc, so
    # the fallback was tcp (slow). Primary path is still MNNVL via
    # cuda_ipc + cumem allocator.
    UCX_TLS: "cuda_copy,cuda_ipc,rc,tcp"
    UCX_CUDA_IPC_ENABLE_MNNVL: "y"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "1024"
    VLLM_MAX_TOKENS_PER_EXPERT_FP4_MOE: "2048"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    TORCH_SYMMMEM: "NVSHMEM"
    # Upstream-parity additions (2026-06-16):
    VLLM_SKIP_P2P_CHECK: "1"
    VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
    VLLM_USE_DEEP_GEMM: "1"
    NVIDIA_GDRCOPY: "enabled"
    VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "120"

decode:
  tp: 1
  enable-expert-parallel: true
  # Tier 1+2 upstream-wide-ep-lws-style tuning (2026-06-16):
  #   - dropped --enable-sleep-mode
  #   - dropped --no-enable-prefix-caching, --no-enable-flashinfer-autotune
  #   - lowered --gpu-memory-utilization 0.9 -> 0.85
  # Re-added --enable-cumem-allocator (2026-06-19): KV cache in cumem is
  # required for MNNVL KV transfer on v0.23+ (see prefill note).
  extra-args: >-
    --kv-cache-dtype fp8
    --max-model-len 9280
    --max-num-seqs 512
    --max-num-batched-tokens 512
    --max-cudagraph-capture-size 512
    --gpu-memory-utilization 0.85
    --enable-cumem-allocator
    --block-size 256
    --compilation-config {"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}
    --stream-interval 50
    --tokenizer-mode deepseek_v4
    --moe-backend deep_gemm_mega_moe
    --enable-ep-weight-filter
    --no-disable-hybrid-kv-cache-manager
  env:
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    NCCL_P2P_LEVEL: "NVL"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    # rc added so KV falls back to InfiniBand, not TCP (see prefill note).
    UCX_TLS: "cuda_copy,cuda_ipc,rc,tcp"
    UCX_CUDA_IPC_ENABLE_MNNVL: "y"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    TORCH_SYMMMEM: "NVSHMEM"
    # Upstream-parity additions (2026-06-16):
    VLLM_SKIP_P2P_CHECK: "1"
    VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
    VLLM_USE_DEEP_GEMM: "1"
    NVIDIA_GDRCOPY: "enabled"

# ---- SLURM resource directives ----
slurm:
  time_limit: "08:00:00"
